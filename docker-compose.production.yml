version: '3.8'

services:
  # Load Balancer & SSL Reverse Proxy
  loadbalancer:
    image: nginx:alpine
    container_name: kondapi_loadbalancer
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      - backend

  # Distributed Redis Broker & Rate Limiting Cache
  redis:
    image: redis:7-alpine
    container_name: kondapi_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-secure_redis_pass_2026}"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  # Fastify Node.js Application Backend Cluster
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kondapi_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kondapi_admin}:${POSTGRES_PASSWORD:-secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-kondapi_db}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secure_redis_pass_2026}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - OTP_SECRET=${OTP_SECRET}
      - SMS_PROVIDER=baileys
      - WHATSAPP_PROVIDER=baileys
      - WHATSAPP_BAILEYS_AUTH_DIR=/app/.baileys_auth
      - ALLOW_MOCK_OTP=false
    depends_on:
      - postgres
      - redis

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kondapi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kondapi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-kondapi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data:
  redis_data:
  ssl_certs:
